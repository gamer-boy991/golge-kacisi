<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stickman Kaçışı</title>

<style>
body{margin:0;background:#111;font-family:Arial;touch-action:none}
canvas{display:block;margin:auto;background:#222}

.btn{
position:fixed;bottom:20px;width:60px;height:60px;
border-radius:50%;background:#00ffff88;
text-align:center;line-height:60px;font-size:24px
}
#left{left:20px}
#right{left:100px}
#jump{right:100px}
#slow{right:20px;background:#ffff0088}

#hud{position:fixed;top:10px;right:10px;color:#fff}

.screen{
position:fixed;inset:0;background:#111;
display:flex;flex-direction:column;
align-items:center;justify-content:center;color:#fff
}
.screen button{
padding:15px 40px;font-size:22px;
border:none;border-radius:30px;background:#00ffff
}
</style>
</head>
<body>

<div id="menu" class="screen">
<h1>Stickman Kaçışı</h1>
<button onclick="start()">BAŞLA</button>
</div>

<div id="end" class="screen" style="display:none">
<h1 id="endText"></h1>
<button onclick="reset()">TEKRAR OYNA</button>
</div>

<div id="hud">Süre: <span id="time">0.0</span></div>
<canvas id="game" width="360" height="640"></canvas>

<div id="left" class="btn">⬅️</div>
<div id="right" class="btn">➡️</div>
<div id="jump" class="btn">⬆️</div>
<div id="slow" class="btn">⚡</div>

<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");

// GÖRSELLER
const playerImg=new Image();
playerImg.src="player.png";

const shadowImg=new Image();
shadowImg.src="shadow.png";

// OYUN DURUMU
let running=false,startTime=0,time=0;
let cam=0,world=2000,slow=0,shield=true;
let L=false,R=false;

// OYUNCU
const p={x:50,y:520,w:40,h:60,vy:0};

// GÖLGELER
const shadows=[
{x:-200,y:520,w:40,h:60,s:1.1},
{x:-400,y:520,w:40,h:60,s:0.8}
];

// PLATFORM & ÇIKIŞ
const plats=[
{x:600,y:480,w:120,h:10},
{x:1000,y:440,w:120,h:10}
];
const exit={x:world-60,y:500,w:40,h:80};

const g=0.6,ground=560;

// DOKUNMATİK
function bind(id,on,off){
const e=document.getElementById(id);
e.ontouchstart=t=>{t.preventDefault();on()};
e.ontouchend=t=>{t.preventDefault();off()};
}
bind("left",()=>L=true,()=>L=false);
bind("right",()=>R=true,()=>R=false);
bind("jump",()=>{if(p.y>=ground)p.vy=-12},()=>{});
bind("slow",()=>{if(slow<=0)slow=180},()=>{});

// OYUN AKIŞI
function start(){
document.getElementById("menu").style.display="none";
init(); running=true;
startTime=performance.now();
loop();
}
function reset(){
document.getElementById("end").style.display="none";
start();
}
function init(){
p.x=50;p.y=520;p.vy=0;
shadows.forEach((s,i)=>s.x=-200*i);
shield=true; slow=0;
}

// ÇARPIŞMA
function hit(a,b){
return a.x<b.x+b.w&&a.x+a.w>b.x&&
a.y<b.y+b.h&&a.y+a.h>b.y;
}

// GÜNCELLE
function update(){
if(!running)return;

time=(performance.now()-startTime)/1000;
document.getElementById("time").innerText=time.toFixed(1);

if(L)p.x-=3;
if(R)p.x+=3;

p.vy+=g;
p.y+=p.vy;
if(p.y>ground){p.y=ground;p.vy=0}

// PLATFORM
plats.forEach(pl=>{
if(p.x<p.x+p.w&&p.x+p.w>pl.x&&
p.y+p.h>pl.y&&p.y+p.h<pl.y+20){
p.y=pl.y-p.h;p.vy=0;
}
});

// GÖLGELER
if(slow>0)slow--;
shadows.forEach(s=>{
let sp=s.s*(slow>0?0.4:1);
s.x+=(p.x>s.x?sp:-sp);
if(hit(p,s)){
if(shield){shield=false;s.x-=60;}
else end("YAKALANDIN");
}
});

if(hit(p,exit)) end("KAÇTIN! 🎉");

cam=Math.max(0,Math.min(p.x-180,world-360));
}

// ÇİZ
function draw(){
ctx.clearRect(0,0,360,640);
ctx.save();ctx.translate(-cam,0);

// ZEMİN
ctx.fillStyle="#444";
ctx.fillRect(0,600,world,40);

// PLATFORM
ctx.fillStyle="#888";
plats.forEach(pl=>ctx.fillRect(pl.x,pl.y,pl.w,pl.h));

// ÇIKIŞ
ctx.fillStyle="#0f0";
ctx.fillRect(exit.x,exit.y,exit.w,exit.h);

// OYUNCU (KESİN)
if(playerImg.complete && playerImg.naturalWidth>0){
ctx.drawImage(playerImg,p.x,p.y,p.w,p.h);
}else{
ctx.fillStyle="#00ffff";
ctx.fillRect(p.x,p.y,p.w,p.h);
}

// GÖLGELER
shadows.forEach(s=>{
if(shadowImg.complete && shadowImg.naturalWidth>0){
ctx.drawImage(shadowImg,s.x,s.y,s.w,s.h);
}else{
ctx.fillStyle="#000";
ctx.fillRect(s.x,s.y,s.w,s.h);
}
});

ctx.restore();
}

// BİTİŞ
function end(t){
running=false;
document.getElementById("endText").innerText=t;
document.getElementById("end").style.display="flex";
}

function loop(){
update(); draw();
if(running)requestAnimationFrame(loop);
}
</script>

</body>
</html>
