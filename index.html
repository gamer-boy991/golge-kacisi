<details>
<summary><strong>📄 index.html (tıkla aç)</strong></summary>
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gölge Kaçışı</title>
<style>
body{margin:0;background:#111;touch-action:none}
canvas{display:block;margin:auto;background:#222}
.btn{position:fixed;bottom:20px;width:60px;height:60px;border-radius:50%;
background:#00ffff88;color:#000;font-size:24px;text-align:center;
line-height:60px;user-select:none}
#left{left:20px} #right{left:100px}
#jump{right:100px} #light{right:20px;background:#ffff0088}
</style>
</head>
<body>

<canvas id="game" width="360" height="640"></canvas>
<div id="left" class="btn">⬅️</div>
<div id="right" class="btn">➡️</div>
<div id="jump" class="btn">⬆️</div>
<div id="light" class="btn">💡</div>

<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let L=false,R=false,cd=0;
const p={x:50,y:520,w:30,h:40,vy:0};
const s={x:250,y:520,w:30,h:40,sp:1};
const g=0.6,gr=560;

const bind=(id,on,off)=>{
 const e=document.getElementById(id);
 e.addEventListener("touchstart",t=>{t.preventDefault();on()});
 e.addEventListener("touchend",t=>{t.preventDefault();off()});
};

bind("left",()=>L=true,()=>L=false);
bind("right",()=>R=true,()=>R=false);
bind("jump",()=>{if(p.y>=gr)p.vy=-12},()=>{});
bind("light",()=>{if(cd<=0)cd=180},()=>{});

function update(){
 if(R)p.x+=3; if(L)p.x-=3;
 p.vy+=g; p.y+=p.vy;
 if(p.y>gr){p.y=gr;p.vy=0}
 if(cd>0)cd--;
 else{
  s.sp=(!L&&!R)?3:1;
  s.x+=(p.x>s.x?s.sp:-s.sp);
 }
 if(p.x<s.x+s.w&&p.x+p.w>s.x&&p.y<s.y+s.h&&p.y+p.h>s.y){
  alert("💀 Gölge seni yakaladı!");
  location.reload();
 }
}

function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 ctx.fillStyle="#444"; ctx.fillRect(0,600,360,40);
 ctx.fillStyle="#00ffff"; ctx.fillRect(p.x,p.y,p.w,p.h);
 ctx.fillStyle="#000"; ctx.fillRect(s.x,s.y,s.w,s.h);
 if(cd>0){
  ctx.fillStyle="rgba(255,255,200,0.2)";
  ctx.fillRect(0,0,360,640);
 }
}

(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>

</body>
</html>
</details>
