<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gölge Kaçışı</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
body{margin:0;background:#000;font-family:Arial;touch-action:none}
canvas{display:block;margin:auto}
.btn{
  position:fixed;bottom:20px;width:60px;height:60px;
  border-radius:50%;background:#00ffff88;
  text-align:center;line-height:60px;font-size:24px
}
#left{left:20px} #right{left:100px} #jump{right:20px}
.overlay{
  position:fixed;inset:0;display:flex;
  justify-content:center;align-items:center;
  flex-direction:column;background:#000c;color:#fff
}
.overlay button{padding:12px 30px;font-size:20px}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="left" class="btn">⬅️</div>
<div id="right" class="btn">➡️</div>
<div id="jump" class="btn">⬆️</div>

<div id="menu" class="overlay">
  <h1>GÖLGE KAÇIŞI</h1>
  <button onclick="startGame()">BAŞLA</button>
</div>

<div id="dead" class="overlay" style="display:none">
  <h1>💀 ÖLDÜN</h1>
  <p>Skor: <span id="finalScore">0</span></p>
  <button onclick="restart()">TEKRAR OYNA</button>
</div>

<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
const W=360,H=640,dpr=window.devicePixelRatio||1;
c.style.width=W+"px";c.style.height=H+"px";
c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);

let gameState="menu";
const groundY=600,charH=60,charY=groundY-charH,gravity=0.6;

const p={x:50,y:charY,w:40,h:charH,vy:0};
let cam=0,score=0,lives=3;

let shadow,npc,bear,spikes=[];

let L=false,R=false;
left.ontouchstart=()=>L=true; left.ontouchend=()=>L=false;
right.ontouchstart=()=>R=true; right.ontouchend=()=>R=false;
jump.ontouchstart=()=>{if(p.y>=charY)p.vy=-12};

const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function startGame(){
  menu.style.display="none";
  dead.style.display="none";
  gameState="play";
  reset();
}

function reset(){
  p.x=50;p.y=charY;p.vy=0;
  cam=0;score=0;lives=3;

  shadow={x:-200,y:charY,w:40,h:charH,s:1};
  npc={x:600,y:charY,w:40,h:charH,dir:1,min:550,max:850};
  bear={x:900,y:charY,w:60,h:60,dir:-1,min:800,max:1200,s:0.8};

  spikes=[
    {x:400,y:groundY-40,w:30,h:40},
    {x:750,y:groundY-40,w:30,h:40},
    {x:1100,y:groundY-40,w:30,h:40}
  ];
}

function die(){
  gameState="dead";
  finalScore.innerText=score;
  dead.style.display="flex";
}

function restart(){startGame();}

function update(){
  if(L)p.x-=3;
  if(R)p.x+=3;

  p.vy+=gravity;
  p.y+=p.vy;
  if(p.y>charY){p.y=charY;p.vy=0}

  shadow.x+=shadow.s;
  npc.x+=npc.dir*1.2;
  if(npc.x<npc.min||npc.x>npc.max)npc.dir*=-1;

  bear.x+=bear.s*bear.dir;
  if(bear.x<bear.min||bear.x>bear.max)bear.dir*=-1;

  if(hit(p,shadow)||hit(p,npc)||hit(p,bear)||spikes.some(s=>hit(p,s))){
    lives--;
    p.x=50;
    if(lives<=0)die();
  }

  cam=Math.max(0,p.x-180);
  score=Math.max(score,Math.floor(p.x/10));
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(-cam,0);

  ctx.fillStyle="#123";
  ctx.fillRect(0,0,2000,H);

  ctx.fillStyle="#444";
  ctx.fillRect(0,groundY,2000,40);

  ctx.fillStyle="#f00";
  spikes.forEach(s=>ctx.fillRect(s.x,s.y,s.w,s.h));

  ctx.fillStyle="#0ff";
  ctx.fillRect(p.x,p.y,p.w,p.h);

  ctx.fillStyle="#000";
  ctx.fillRect(shadow.x,shadow.y,shadow.w,shadow.h);

  ctx.fillStyle="#ff0";
  ctx.fillRect(npc.x,npc.y,npc.w,npc.h);

  ctx.fillStyle="#8b4513"; // 🐻 AYI
  ctx.fillRect(bear.x,bear.y,bear.w,bear.h);

  ctx.restore();

  ctx.fillStyle="#fff";
  ctx.fillText("❤️ "+lives+"  🪙 "+score,10,20);
}

function loop(){
  if(gameState==="play"){update();draw();}
  requestAnimationFrame(loop);
}
loop();

if("serviceWorker"in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
