<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gölge Kaçışı</title>

<style>
body{margin:0;background:#000;font-family:Arial;touch-action:none}
canvas{display:block;margin:auto}
.btn{
  position:fixed;bottom:20px;width:60px;height:60px;
  border-radius:50%;background:#00ffff88;
  text-align:center;line-height:60px;font-size:24px
}
#left{left:20px} #right{left:100px}
#jump{right:20px}
.overlay{
  position:fixed;inset:0;display:flex;
  flex-direction:column;justify-content:center;align-items:center;
  background:#000c;color:#fff;text-align:center
}
.overlay button{
  margin-top:20px;padding:12px 30px;
  font-size:20px;border:0;border-radius:10px
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="left" class="btn">⬅️</div>
<div id="right" class="btn">➡️</div>
<div id="jump" class="btn">⬆️</div>

<!-- GİRİŞ -->
<div id="menu" class="overlay">
  <h1>GÖLGE KAÇIŞI</h1>
  <p>Koş • Zıpla • Kaç</p>
  <button onclick="startGame()">BAŞLA</button>
</div>

<!-- ÖLÜM -->
<div id="dead" class="overlay" style="display:none">
  <h1>💀 ÖLDÜN</h1>
  <p>Skor: <span id="finalScore">0</span></p>
  <button onclick="restart()">TEKRAR OYNA</button>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

// 📱 Retina fix
const W=360,H=640,dpr=window.devicePixelRatio||1;
c.style.width=W+"px";c.style.height=H+"px";
c.width=W*dpr;c.height=H*dpr;
ctx.scale(dpr,dpr);

// 🎮 DURUM
let gameState="menu";

// 📐 SABİTLER
const groundY=600,charH=60,charY=groundY-charH,g=0.6;

// OYUN
let cam=0,score=0,lives=3;
const p={x:50,y:charY,w:40,h:charH,vy:0};
let shadow,npc;

// 🎮 Kontrol
let L=false,R=false;
document.getElementById("left").ontouchstart=()=>L=true;
document.getElementById("left").ontouchend=()=>L=false;
document.getElementById("right").ontouchstart=()=>R=true;
document.getElementById("right").ontouchend=()=>R=false;
document.getElementById("jump").ontouchstart=()=>{
  if(p.y>=charY)p.vy=-12;
};

// Çarpışma
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

// 🎨 Arka plan
function bg(){
  const g1=ctx.createLinearGradient(0,0,0,H);
  g1.addColorStop(0,"#0a1a2a");
  g1.addColorStop(1,"#1e3c5a");
  ctx.fillStyle=g1;ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#142838";
  for(let i=0;i<6;i++){
    ctx.beginPath();
    ctx.moveTo(i*300-cam*0.2,600);
    ctx.lineTo(i*300+150-cam*0.2,420);
    ctx.lineTo(i*300+300-cam*0.2,600);
    ctx.fill();
  }
}

// 🎮 Başlat
function startGame(){
  document.getElementById("menu").style.display="none";
  gameState="play";
  reset();
}

// 🔁 Reset
function reset(){
  p.x=50;p.y=charY;p.vy=0;
  score=0;lives=3;cam=0;
  shadow={x:-200,y:charY,w:40,h:charH,s:1};
  npc={x:700,y:charY,w:40,h:charH,dir:1,min:600,max:900};
}

// ☠️ Öl
function die(){
  gameState="dead";
  document.getElementById("finalScore").innerText=score;
  document.getElementById("dead").style.display="flex";
}

// 🔄 Restart
function restart(){
  document.getElementById("dead").style.display="none";
  startGame();
}

// 🔄 Update
function update(){
  if(L)p.x-=3;
  if(R)p.x+=3;
  p.vy+=g;p.y+=p.vy;
  if(p.y>charY){p.y=charY;p.vy=0;}

  shadow.x+=shadow.s;
  npc.x+=npc.dir*1.5;
  if(npc.x<npc.min||npc.x>npc.max)npc.dir*=-1;

  if(hit(p,shadow)||hit(p,npc)){
    lives--;
    p.x=50;
    if(lives<=0)die();
  }

  cam=Math.max(0,p.x-180);
  score=Math.max(score,Math.floor(p.x/10));
}

// 🎨 Draw
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(-cam,0);

  bg();
  ctx.fillStyle="#444";ctx.fillRect(0,groundY,2000,40);

  ctx.fillStyle="#0ff";ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#000";ctx.fillRect(shadow.x,shadow.y,shadow.w,shadow.h);
  ctx.fillStyle="#ff0";ctx.fillRect(npc.x,npc.y,npc.w,npc.h);

  ctx.restore();

  ctx.fillStyle="#fff";
  ctx.fillText("❤️ "+lives+"  🪙 "+score,10,20);
}

// 🔁 Loop
function loop(){
  if(gameState==="play"){update();draw();}
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
